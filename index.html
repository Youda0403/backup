<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#ffffff">
  <title>💕 커플 HTML 뷰어</title>
  <style>
    :root {
      --a-primary: #ff6b9d;
      --a-light: #fff0f6;
      --a-border: #ffc0d9;
      --b-primary: #7b9dff;
      --b-light: #f0f3ff;
      --b-border: #c0cfff;
      --text: #1a1a2e;
      --text-sub: #888;
      --bg: #f7f8fa;
      --card: #ffffff;
      --shadow: 0 2px 16px rgba(0,0,0,0.07);
      --r: 18px;
      --r-sm: 12px;
      --cur: #ff6b9d;
      --cur-light: #fff0f6;
      --cur-border: #ffc0d9;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Noto Sans KR', 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100dvh;
      overflow-x: hidden;
    }

    /* ── Views ── */
    .view { display: none; flex-direction: column; }
    .view.active { display: flex; }
    /* 스크롤 가능한 전체 화면 (잠금, 웰컴) */
    #lock, #welcome { min-height: 100dvh; }
    /* 내부 스크롤 고정 화면 */
    #home, #add, #view { height: 100dvh; }

    /* ══════════════════════════════
       WELCOME
    ══════════════════════════════ */
    #welcome {
      position: relative;
      align-items: center;
      justify-content: center;
      padding: 48px 24px 64px;
      background: linear-gradient(160deg, #fff0f8 0%, #f0f4ff 50%, #fff8f0 100%);
    }
    .wlc-emoji { font-size: 72px; margin-bottom: 12px; }
    .wlc-title {
      font-size: 26px; font-weight: 900; text-align: center; margin-bottom: 6px;
      background: linear-gradient(135deg, var(--a-primary), var(--b-primary));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    .wlc-sub { font-size: 14px; color: var(--text-sub); margin-bottom: 44px; text-align: center; }
    .profile-cards { display: flex; flex-direction: column; gap: 14px; width: 100%; max-width: 360px; }

    .pcard {
      background: white; border-radius: var(--r); padding: 18px 20px;
      display: flex; align-items: center; gap: 14px;
      cursor: pointer; border: 2px solid transparent;
      box-shadow: var(--shadow); transition: transform .15s ease;
    }
    .pcard:active { transform: scale(0.97); }
    .pcard.a { border-color: var(--a-border); }
    .pcard.b { border-color: var(--b-border); }
    .pcard-av {
      width: 50px; height: 50px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center; font-size: 26px; flex-shrink: 0;
    }
    .pcard.a .pcard-av { background: var(--a-light); }
    .pcard.b .pcard-av { background: var(--b-light); }
    .pcard-info { flex: 1; }
    .pcard-name { font-size: 16px; font-weight: 700; }
    .pcard-count { font-size: 12px; color: var(--text-sub); margin-top: 3px; }
    .pcard-setup {
      font-size: 12px; padding: 5px 10px; border-radius: 20px;
      background: var(--bg); border: none; cursor: pointer; color: var(--text-sub);
    }
    .pcard-arrow { font-size: 22px; color: #ccc; }

    /* ══════════════════════════════
       HEADER
    ══════════════════════════════ */
    .hdr {
      padding: 14px 16px;
      padding-top: calc(14px + env(safe-area-inset-top, 0px));
      background: white; border-bottom: 1px solid #f0f0f0;
      display: flex; align-items: center; gap: 10px;
      position: sticky; top: 0; z-index: 100;
    }
    .hdr-back {
      width: 38px; height: 38px; border-radius: 50%; background: var(--bg);
      border: none; cursor: pointer; font-size: 20px; display: flex;
      align-items: center; justify-content: center; flex-shrink: 0;
    }
    .hdr-av {
      width: 36px; height: 36px; border-radius: 50%; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center; font-size: 20px;
    }
    .hdr-title { flex: 1; font-size: 17px; font-weight: 700; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .hdr-btn {
      border: none; background: none; cursor: pointer;
      font-size: 14px; font-weight: 600; padding: 8px 10px;
      border-radius: var(--r-sm); color: var(--cur); flex-shrink: 0;
    }
    .hdr-switch {
      font-size: 12px; padding: 6px 10px; border-radius: 20px;
      background: var(--bg); border: none; cursor: pointer; color: var(--text-sub); flex-shrink: 0;
    }

    /* ══════════════════════════════
       HOME
    ══════════════════════════════ */
    .search-wrap { padding: 10px 14px 10px; background: white; border-bottom: 1px solid #f0f0f0; }
    .search-inp {
      width: 100%; background: var(--bg); border: none; border-radius: 24px;
      padding: 10px 16px; font-size: 15px; font-family: inherit; color: var(--text);
    }
    .search-inp:focus { outline: none; }

    .home-body { flex: 1; min-height: 0; padding: 14px; overflow-y: auto; padding-bottom: 96px; }

    .empty {
      display: flex; flex-direction: column; align-items: center;
      padding: 72px 20px; text-align: center; color: var(--text-sub);
    }
    .empty-ico { font-size: 56px; margin-bottom: 14px; }
    .empty-ttl { font-size: 17px; font-weight: 600; color: var(--text); margin-bottom: 8px; }
    .empty-desc { font-size: 13px; line-height: 1.7; }

    .cards { display: flex; flex-direction: column; gap: 12px; }

    .scard {
      background: white; border-radius: var(--r); overflow: hidden;
      box-shadow: var(--shadow); cursor: pointer;
      border: 1px solid #f0f0f0; transition: transform .15s;
    }
    .scard:active { transform: scale(0.98); }

    .scard-thumb {
      height: 130px; overflow: hidden; position: relative;
      background: var(--cur-light); pointer-events: none;
    }
    .scard-thumb iframe {
      position: absolute; top: 0; left: 0;
      width: 167%; height: 217px;
      transform: scale(0.6); transform-origin: top left;
      border: none; pointer-events: none;
    }

    .scard-foot { padding: 11px 14px; display: flex; align-items: center; gap: 8px; }
    .scard-text { flex: 1; min-width: 0; }
    .scard-ttl { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .scard-date { font-size: 11px; color: var(--text-sub); margin-top: 2px; }
    .scard-del {
      width: 30px; height: 30px; border-radius: 50%; background: #fff5f5;
      border: none; cursor: pointer; font-size: 13px;
      display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    }

    .fab {
      position: fixed;
      bottom: calc(22px + env(safe-area-inset-bottom, 0px));
      right: 22px;
      width: 58px; height: 58px; border-radius: 50%;
      background: var(--cur); border: none; cursor: pointer;
      font-size: 30px; color: white;
      box-shadow: 0 4px 20px rgba(0,0,0,0.2);
      z-index: 100; transition: transform .15s;
      display: flex; align-items: center; justify-content: center;
    }
    .fab:active { transform: scale(0.9); }

    /* ══════════════════════════════
       ADD / EDIT
    ══════════════════════════════ */
    .add-body {
      flex: 1; min-height: 0; padding: 18px 14px;
      overflow-y: auto; padding-bottom: 40px;
      display: flex; flex-direction: column; gap: 18px;
    }
    .fgroup { display: flex; flex-direction: column; gap: 7px; }
    .flabel { font-size: 12px; font-weight: 700; color: var(--text-sub); text-transform: uppercase; letter-spacing: .5px; }
    .finput {
      border: 2px solid #ebebeb; border-radius: var(--r-sm);
      padding: 13px 15px; font-size: 16px; font-family: inherit;
      background: white; color: var(--text); transition: border-color .2s; width: 100%;
    }
    .finput:focus { outline: none; border-color: var(--cur); }
    .ftextarea {
      min-height: 180px; resize: vertical;
      font-family: 'Menlo', 'Monaco', 'Courier New', monospace;
      font-size: 12.5px; line-height: 1.65;
    }
    .preview-btn {
      background: var(--cur-light); border: 2px solid var(--cur-border);
      border-radius: var(--r-sm); padding: 12px; font-size: 14px;
      font-weight: 700; color: var(--cur); cursor: pointer; text-align: center;
    }
    .preview-box {
      border: 2px solid var(--cur-border); border-radius: var(--r-sm);
      overflow: hidden; background: white; height: 280px; display: none;
    }
    .preview-box iframe { width: 100%; height: 100%; border: none; }
    .save-btn {
      background: var(--cur); color: white; border: none;
      border-radius: var(--r-sm); padding: 16px; font-size: 16px;
      font-weight: 700; cursor: pointer; width: 100%;
    }
    .save-btn:active { opacity: .85; }

    /* ══════════════════════════════
       VIEW
    ══════════════════════════════ */
    .view-frame { flex: 1; min-height: 0; overflow: hidden; }
    .view-frame iframe { width: 100%; height: 100%; border: none; display: block; }

    /* ══════════════════════════════
       MODAL (profile setup)
    ══════════════════════════════ */
    .overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,.45);
      z-index: 200; display: flex; align-items: flex-end; justify-content: center;
    }
    .overlay.hidden { display: none; }
    .sheet {
      background: white; border-radius: 24px 24px 0 0;
      padding: 24px 20px;
      padding-bottom: calc(28px + env(safe-area-inset-bottom, 0px));
      width: 100%; max-width: 480px;
    }
    .sheet-handle { width: 38px; height: 4px; background: #e0e0e0; border-radius: 2px; margin: 0 auto 22px; }
    .sheet-title { font-size: 20px; font-weight: 800; margin-bottom: 5px; }
    .sheet-sub { font-size: 13px; color: var(--text-sub); margin-bottom: 22px; }

    .emoji-grid { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 4px; }
    .emoji-opt {
      width: 42px; height: 42px; border-radius: var(--r-sm);
      background: var(--bg); border: 2px solid transparent;
      cursor: pointer; font-size: 21px;
      display: flex; align-items: center; justify-content: center;
    }
    .emoji-opt.on { border-color: var(--cur); background: var(--cur-light); }

    .sheet-ok {
      background: var(--cur); color: white; border: none;
      border-radius: var(--r-sm); padding: 15px; font-size: 16px;
      font-weight: 700; cursor: pointer; width: 100%; margin-top: 18px;
    }

    /* ══════════════════════════════
       LOCK SCREEN
    ══════════════════════════════ */
    #lock {
      align-items: center; justify-content: center;
      padding: 48px 24px 64px;
      background: linear-gradient(160deg, #fff0f8 0%, #f0f4ff 50%, #fff8f0 100%);
    }
    .lock-icon { font-size: 56px; margin-bottom: 16px; }
    .lock-title { font-size: 22px; font-weight: 900; margin-bottom: 6px; color: var(--text); }
    .lock-sub { font-size: 14px; color: var(--text-sub); margin-bottom: 36px; text-align: center; min-height: 20px; }
    .lock-dots { display: flex; gap: 16px; margin-bottom: 40px; }
    .lock-dot {
      width: 16px; height: 16px; border-radius: 50%;
      border: 2px solid #ccc; background: transparent;
      transition: all .15s;
    }
    .lock-dot.on { background: var(--a-primary); border-color: var(--a-primary); }
    .lock-dot.err { background: #ff4444; border-color: #ff4444; }
    .pin-pad { display: grid; grid-template-columns: repeat(3, 72px); gap: 14px; }
    .pin-btn {
      width: 72px; height: 72px; border-radius: 50%;
      background: white; border: none; font-size: 24px; font-weight: 600;
      cursor: pointer; box-shadow: var(--shadow);
      display: flex; align-items: center; justify-content: center;
      transition: transform .1s, background .1s;
      color: var(--text);
    }
    .pin-btn:active { transform: scale(0.9); background: #f0f0f0; }
    .pin-btn.del { font-size: 20px; color: var(--text-sub); }
    .pin-btn.empty { background: transparent; box-shadow: none; cursor: default; }
    @keyframes shake {
      0%,100% { transform: translateX(0); }
      20%,60% { transform: translateX(-8px); }
      40%,80% { transform: translateX(8px); }
    }
    .lock-dots.shake { animation: shake .35s ease; }

    /* ══════════════════════════════
       TOAST
    ══════════════════════════════ */
    #toast {
      position: fixed;
      bottom: calc(88px + env(safe-area-inset-bottom, 0px));
      left: 50%; transform: translateX(-50%) translateY(12px);
      background: rgba(30,30,30,.92); color: white;
      padding: 11px 20px; border-radius: 24px; font-size: 14px; font-weight: 500;
      z-index: 999; opacity: 0; transition: all .25s ease; white-space: nowrap;
      pointer-events: none;
    }
    #toast.on { opacity: 1; transform: translateX(-50%) translateY(0); }
  </style>
</head>
<body>

<!-- ═══ LOCK ═══ -->
<div id="lock" class="view active">
  <div class="lock-icon" id="lock-icon">🔒</div>
  <div class="lock-title" id="lock-title">잠금 해제</div>
  <div class="lock-sub" id="lock-sub">비밀번호를 입력해주세요</div>
  <div class="lock-dots" id="lock-dots">
    <div class="lock-dot" id="d0"></div>
    <div class="lock-dot" id="d1"></div>
    <div class="lock-dot" id="d2"></div>
    <div class="lock-dot" id="d3"></div>
  </div>
  <div class="pin-pad">
    <button class="pin-btn" onclick="pinInput('1')">1</button>
    <button class="pin-btn" onclick="pinInput('2')">2</button>
    <button class="pin-btn" onclick="pinInput('3')">3</button>
    <button class="pin-btn" onclick="pinInput('4')">4</button>
    <button class="pin-btn" onclick="pinInput('5')">5</button>
    <button class="pin-btn" onclick="pinInput('6')">6</button>
    <button class="pin-btn" onclick="pinInput('7')">7</button>
    <button class="pin-btn" onclick="pinInput('8')">8</button>
    <button class="pin-btn" onclick="pinInput('9')">9</button>
    <button class="pin-btn empty" disabled></button>
    <button class="pin-btn" onclick="pinInput('0')">0</button>
    <button class="pin-btn del" onclick="pinDel()">⌫</button>
  </div>
</div>

<!-- ═══ WELCOME ═══ -->
<div id="welcome" class="view active">
  <button onclick="lockApp()" style="position:absolute;top:calc(16px + env(safe-area-inset-top,0px));right:16px;background:white;border:none;border-radius:20px;padding:7px 14px;font-size:13px;cursor:pointer;box-shadow:var(--shadow);color:var(--text-sub);">🔒 잠금</button>
  <div class="wlc-emoji">💕</div>
  <h1 class="wlc-title">커플 HTML 뷰어</h1>
  <p class="wlc-sub">AI랑 나눈 이야기를 예쁘게 백업해요</p>
  <div class="profile-cards">
    <div class="pcard a" id="pcard-a">
      <div class="pcard-av" id="av-a">🌸</div>
      <div class="pcard-info">
        <div class="pcard-name" id="pname-a">커플링 A</div>
        <div class="pcard-count" id="pcnt-a">저장된 항목 없음</div>
      </div>
      <button class="pcard-setup" onclick="event.stopPropagation(); openModal('a')">설정</button>
      <div class="pcard-arrow">›</div>
    </div>
    <div class="pcard b" id="pcard-b">
      <div class="pcard-av" id="av-b">🌙</div>
      <div class="pcard-info">
        <div class="pcard-name" id="pname-b">커플링 B</div>
        <div class="pcard-count" id="pcnt-b">저장된 항목 없음</div>
      </div>
      <button class="pcard-setup" onclick="event.stopPropagation(); openModal('b')">설정</button>
      <div class="pcard-arrow">›</div>
    </div>
  </div>
</div>

<!-- ═══ HOME ═══ -->
<div id="home" class="view">
  <div class="hdr">
    <div class="hdr-av" id="hdr-av">🌸</div>
    <div class="hdr-title" id="hdr-title">내 저장소</div>
    <button class="hdr-switch" onclick="goWelcome()">전환</button>
  </div>
  <div class="search-wrap">
    <input class="search-inp" type="search" id="search" placeholder="🔍 검색..." oninput="renderList()" />
  </div>
  <div class="home-body">
    <div class="cards" id="cards"></div>
  </div>
  <button class="fab" id="fab" onclick="goAdd()">+</button>
</div>

<!-- ═══ ADD / EDIT ═══ -->
<div id="add" class="view">
  <div class="hdr">
    <button class="hdr-back" onclick="goHome()">‹</button>
    <div class="hdr-title" id="add-hdr-title">새로 추가</div>
    <button class="hdr-btn" onclick="saveItem()">저장</button>
  </div>
  <div class="add-body">
    <div class="fgroup">
      <label class="flabel">제목</label>
      <input class="finput" id="f-title" type="text" placeholder="이 대화의 제목을 입력해요" />
    </div>
    <div class="fgroup">
      <label class="flabel">HTML 코드</label>
      <textarea class="finput ftextarea" id="f-html" placeholder="AI가 만들어준 HTML을 여기에 붙여넣어요..."></textarea>
    </div>
    <button class="preview-btn" onclick="togglePreview()">👁 미리보기 토글</button>
    <div class="preview-box" id="preview-box">
      <iframe id="preview-iframe" sandbox="allow-scripts"></iframe>
    </div>
    <button class="save-btn" onclick="saveItem()">💾 저장하기</button>
  </div>
</div>

<!-- ═══ VIEW ═══ -->
<div id="view" class="view">
  <div class="hdr">
    <button class="hdr-back" onclick="goHome()">‹</button>
    <div class="hdr-title" id="view-title">제목</div>
    <button class="hdr-btn" onclick="editCurrent()">편집</button>
  </div>
  <div class="view-frame">
    <iframe id="view-iframe" sandbox="allow-scripts allow-popups"></iframe>
  </div>
</div>

<!-- ═══ PROFILE MODAL ═══ -->
<div class="overlay hidden" id="modal" onclick="closeModalOutside(event)">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-title" id="modal-title">프로필 설정</div>
    <div class="sheet-sub">이름이랑 이모지를 골라주세요 ✨</div>
    <div class="fgroup">
      <label class="flabel">이름</label>
      <input class="finput" id="modal-name" type="text" placeholder="닉네임 입력" maxlength="20" />
    </div>
    <div class="fgroup" style="margin-top:14px">
      <label class="flabel">이모지</label>
      <div style="display:flex;gap:10px;align-items:center;margin-bottom:10px">
        <div id="emoji-preview" style="font-size:34px;width:52px;height:52px;background:var(--bg);border-radius:var(--r-sm);display:flex;align-items:center;justify-content:center;flex-shrink:0">🌸</div>
        <input class="finput" id="emoji-custom" type="text" placeholder="이모지 직접 붙여넣기 🎨" style="flex:1" />
      </div>
      <div class="emoji-grid" id="emoji-grid"></div>
    </div>
    <button class="sheet-ok" onclick="saveProfile()">완료 ✓</button>
  </div>
</div>

<!-- ═══ TOAST ═══ -->
<div id="toast"></div>

<script>
// ──────────────────────────────────────────
// Constants & Storage
// ──────────────────────────────────────────
const EMOJIS = ['🌸','🌙','⭐','🦋','🌺','🍀','🌈','🎀','💫','🐱',
                 '🐰','🦊','🌻','🍓','🎵','✨','💜','💙','🌿','🐸',
                 '🎠','🍑','🌷','🦄','🍭','🧸','🎶','🌊','🍵','🔮'];

const KEY_PROF = 'cvb_profiles';
const KEY_SAVES = u => `cvb_saves_${u}`;

let CU = null;       // current user 'a' | 'b'
let CI = null;       // current item being viewed/edited
let MU = null;       // user being set up in modal

function getProfiles() {
  try { return JSON.parse(localStorage.getItem(KEY_PROF)) || defaultProfiles(); }
  catch { return defaultProfiles(); }
}
function defaultProfiles() {
  return { a: { name: '커플링 A', emoji: '🌸' }, b: { name: '커플링 B', emoji: '🌙' } };
}
function saveProfiles(p) { localStorage.setItem(KEY_PROF, JSON.stringify(p)); }

function getSaves(u) {
  try { return JSON.parse(localStorage.getItem(KEY_SAVES(u))) || []; }
  catch { return []; }
}
function setSaves(u, arr) { localStorage.setItem(KEY_SAVES(u), JSON.stringify(arr)); }

// ──────────────────────────────────────────
// Theme
// ──────────────────────────────────────────
function applyTheme(u) {
  const r = document.documentElement.style;
  if (u === 'a') {
    r.setProperty('--cur', 'var(--a-primary)');
    r.setProperty('--cur-light', 'var(--a-light)');
    r.setProperty('--cur-border', 'var(--a-border)');
  } else {
    r.setProperty('--cur', 'var(--b-primary)');
    r.setProperty('--cur-light', 'var(--b-light)');
    r.setProperty('--cur-border', 'var(--b-border)');
  }
}

// ──────────────────────────────────────────
// View Navigation
// ──────────────────────────────────────────
function show(id) {
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  window.scrollTo(0, 0);
}

function goWelcome() { CU = null; refreshWelcome(); show('welcome'); }
function goHome() { renderList(); show('home'); }
function goAdd() {
  CI = null;
  document.getElementById('f-title').value = '';
  document.getElementById('f-html').value = '';
  document.getElementById('preview-box').style.display = 'none';
  document.getElementById('add-hdr-title').textContent = '새로 추가';
  show('add');
}

function editCurrent() {
  if (!CI) return;
  document.getElementById('f-title').value = CI.title;
  document.getElementById('f-html').value = CI.html;
  document.getElementById('preview-box').style.display = 'none';
  document.getElementById('add-hdr-title').textContent = '편집';
  show('add');
}

// ──────────────────────────────────────────
// Welcome
// ──────────────────────────────────────────
function refreshWelcome() {
  const p = getProfiles();
  ['a','b'].forEach(u => {
    const cnt = getSaves(u).length;
    document.getElementById(`av-${u}`).textContent = p[u].emoji;
    document.getElementById(`pname-${u}`).textContent = p[u].name;
    document.getElementById(`pcnt-${u}`).textContent = cnt === 0 ? '저장된 항목 없음' : `${cnt}개 저장됨`;
  });
}

function selectUser(u) {
  CU = u; applyTheme(u);
  const p = getProfiles();
  document.getElementById('hdr-av').textContent = p[u].emoji;
  document.getElementById('hdr-title').textContent = p[u].name + '의 저장소';
  goHome();
}

// card click → selectUser
document.getElementById('pcard-a').addEventListener('click', () => selectUser('a'));
document.getElementById('pcard-b').addEventListener('click', () => selectUser('b'));

// ──────────────────────────────────────────
// Lock / PIN
// ──────────────────────────────────────────
const KEY_PWD = 'cvb_pwd_hash';
let pinBuffer = '';
let pinState = 'unlock'; // 'unlock' | 'setup1' | 'setup2'
let pinFirst = '';

async function sha256(str) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join('');
}

function initApp() {
  if (sessionStorage.getItem('cvb_unlocked') === '1') {
    refreshWelcome(); show('welcome'); return;
  }
  const stored = localStorage.getItem(KEY_PWD);
  if (!stored) {
    setLockState('setup1');
  } else {
    setLockState('unlock');
  }
  show('lock');
}

function setLockState(state) {
  pinState = state; pinBuffer = '';
  if (state !== 'setup2') pinFirst = '';
  updateDots();
  const sub = document.getElementById('lock-sub');
  const title = document.getElementById('lock-title');
  const icon = document.getElementById('lock-icon');
  if (state === 'unlock') {
    icon.textContent = '🔒'; title.textContent = '잠금 해제';
    sub.textContent = '비밀번호를 입력해주세요';
  } else if (state === 'setup1') {
    icon.textContent = '🔐'; title.textContent = '비밀번호 설정';
    sub.textContent = '새 비밀번호 4자리를 입력해주세요';
  } else {
    icon.textContent = '🔐'; title.textContent = '비밀번호 확인';
    sub.textContent = '한 번 더 입력해주세요';
  }
}

function updateDots(err) {
  for (let i = 0; i < 4; i++) {
    const d = document.getElementById(`d${i}`);
    d.classList.toggle('on', i < pinBuffer.length && !err);
    d.classList.toggle('err', !!err);
  }
}

function pinInput(digit) {
  if (pinBuffer.length >= 4) return;
  pinBuffer += digit;
  updateDots();
  if (pinBuffer.length === 4) setTimeout(pinSubmit, 80);
}

function pinDel() {
  pinBuffer = pinBuffer.slice(0, -1);
  updateDots();
}

async function pinSubmit() {
  const hash = await sha256(pinBuffer);
  if (pinState === 'unlock') {
    const stored = localStorage.getItem(KEY_PWD);
    if (hash === stored) {
      sessionStorage.setItem('cvb_unlocked', '1');
      refreshWelcome(); show('welcome');
    } else {
      pinShake(); pinBuffer = ''; updateDots();
      document.getElementById('lock-sub').textContent = '틀렸어요, 다시 입력해주세요 🥺';
    }
  } else if (pinState === 'setup1') {
    pinFirst = hash;
    setLockState('setup2');
  } else {
    if (hash === pinFirst) {
      localStorage.setItem(KEY_PWD, hash);
      sessionStorage.setItem('cvb_unlocked', '1');
      toast('비밀번호가 설정됐어요! 🔐');
      refreshWelcome(); show('welcome');
    } else {
      pinShake(); setLockState('setup1');
      document.getElementById('lock-sub').textContent = '일치하지 않아요, 처음부터 다시 입력해주세요';
    }
  }
}

function pinShake() {
  const dots = document.getElementById('lock-dots');
  updateDots(true);
  dots.classList.add('shake');
  setTimeout(() => { dots.classList.remove('shake'); updateDots(false); }, 400);
}

function lockApp() {
  sessionStorage.removeItem('cvb_unlocked');
  setLockState('unlock');
  show('lock');
}

// ──────────────────────────────────────────
// Profile Modal
// ──────────────────────────────────────────
function openModal(u) {
  MU = u; applyTheme(u);
  const p = getProfiles()[u];
  document.getElementById('modal-title').textContent = u === 'a' ? '✨ 커플링 A 설정' : '✨ 커플링 B 설정';
  document.getElementById('modal-name').value = (p.name === `커플링 ${u.toUpperCase()}`) ? '' : p.name;

  const customInp = document.getElementById('emoji-custom');
  const preview = document.getElementById('emoji-preview');
  customInp.value = p.emoji;
  preview.textContent = p.emoji;
  customInp.oninput = () => {
    const val = [...customInp.value].find(c => c.trim());
    if (val) { preview.textContent = val; grid.querySelectorAll('.emoji-opt').forEach(b => b.classList.remove('on')); }
  };

  const grid = document.getElementById('emoji-grid');
  grid.innerHTML = '';
  EMOJIS.forEach(e => {
    const btn = document.createElement('button');
    btn.className = 'emoji-opt' + (e === p.emoji ? ' on' : '');
    btn.textContent = e;
    btn.onclick = () => {
      grid.querySelectorAll('.emoji-opt').forEach(b => b.classList.remove('on'));
      btn.classList.add('on');
      customInp.value = e;
      preview.textContent = e;
    };
    grid.appendChild(btn);
  });

  document.getElementById('modal').classList.remove('hidden');
  setTimeout(() => document.getElementById('modal-name').focus(), 100);
}

function closeModalOutside(e) {
  if (e.target === document.getElementById('modal'))
    document.getElementById('modal').classList.add('hidden');
}

function saveProfile() {
  const name = document.getElementById('modal-name').value.trim();
  if (!name) { toast('이름을 입력해주세요!'); return; }
  const customVal = document.getElementById('emoji-custom').value.trim();
  const firstEmoji = customVal ? ([...customVal].find(c => c.trim()) || '') : '';
  const sel = document.querySelector('#emoji-grid .emoji-opt.on');
  const emoji = firstEmoji || (sel ? sel.textContent : (MU === 'a' ? '🌸' : '🌙'));
  const p = getProfiles();
  p[MU] = { name, emoji };
  saveProfiles(p);
  document.getElementById('modal').classList.add('hidden');
  refreshWelcome();
  toast('프로필 저장됐어요! ✨');
}

// ──────────────────────────────────────────
// Home List
// ──────────────────────────────────────────
function renderList() {
  const saves = getSaves(CU);
  const q = (document.getElementById('search').value || '').toLowerCase();
  const list = q ? saves.filter(s => s.title.toLowerCase().includes(q) || s.html.toLowerCase().includes(q)) : saves;

  const container = document.getElementById('cards');
  container.innerHTML = '';

  if (list.length === 0) {
    container.innerHTML = `
      <div class="empty">
        <div class="empty-ico">${saves.length === 0 ? '📭' : '🔍'}</div>
        <div class="empty-ttl">${saves.length === 0 ? '아직 저장된 게 없어요' : '검색 결과가 없어요'}</div>
        <div class="empty-desc">${saves.length === 0 ? 'AI랑 나눈 대화를\n+ 버튼으로 저장해보세요!' : '다른 단어로 검색해보세요'}</div>
      </div>`;
    return;
  }

  list.forEach(item => {
    const card = document.createElement('div');
    card.className = 'scard';

    const date = new Date(item.date).toLocaleDateString('ko-KR', { year:'numeric', month:'long', day:'numeric' });

    card.innerHTML = `
      <div class="scard-thumb"></div>
      <div class="scard-foot">
        <div class="scard-text">
          <div class="scard-ttl">${esc(item.title)}</div>
          <div class="scard-date">${date}</div>
        </div>
        <button class="scard-del" data-id="${item.id}">🗑</button>
      </div>`;

    // thumbnail iframe (set via JS to avoid attribute escaping issues)
    const thumb = card.querySelector('.scard-thumb');
    const iframe = document.createElement('iframe');
    iframe.setAttribute('sandbox', 'allow-scripts');
    iframe.scrolling = 'no';
    iframe.srcdoc = item.html;
    thumb.appendChild(iframe);

    card.querySelector('.scard-del').addEventListener('click', e => {
      e.stopPropagation();
      deleteItem(item.id);
    });
    card.addEventListener('click', () => openItem(item));
    container.appendChild(card);
  });
}

function openItem(item) {
  CI = item;
  document.getElementById('view-title').textContent = item.title;
  document.getElementById('view-iframe').srcdoc = item.html;
  show('view');
}

function deleteItem(id) {
  if (!confirm('정말 삭제할까요?')) return;
  setSaves(CU, getSaves(CU).filter(s => s.id !== id));
  renderList();
  toast('삭제했어요 🗑');
}

// ──────────────────────────────────────────
// Add / Edit / Save
// ──────────────────────────────────────────
function togglePreview() {
  const html = document.getElementById('f-html').value;
  const box = document.getElementById('preview-box');
  if (box.style.display === 'none' || !box.style.display) {
    if (!html.trim()) { toast('HTML을 먼저 입력해주세요!'); return; }
    document.getElementById('preview-iframe').srcdoc = html;
    box.style.display = 'block';
  } else {
    box.style.display = 'none';
  }
}

function saveItem() {
  const title = document.getElementById('f-title').value.trim();
  const html  = document.getElementById('f-html').value.trim();
  if (!title) { toast('제목을 입력해주세요!'); return; }
  if (!html)  { toast('HTML 코드를 입력해주세요!'); return; }

  const saves = getSaves(CU);
  if (CI) {
    const idx = saves.findIndex(s => s.id === CI.id);
    if (idx !== -1) saves[idx] = { ...saves[idx], title, html };
    CI = null;
    toast('수정됐어요! ✨');
  } else {
    saves.unshift({ id: Date.now().toString(), title, html, date: new Date().toISOString() });
    toast('저장했어요! 💾');
  }
  setSaves(CU, saves);
  goHome();
}

// ──────────────────────────────────────────
// Utilities
// ──────────────────────────────────────────
function esc(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

let toastTimer;
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('on'), 2400);
}

// ──────────────────────────────────────────
// Init
// ──────────────────────────────────────────
initApp();
</script>
